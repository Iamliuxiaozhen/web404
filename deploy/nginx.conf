worker_processes auto;
pid nginx.pid;

events {
    worker_connections 1024;
}

http {
    default_type application/octet-stream;
    access_log off;
    error_log stderr warn;

    map $http_accept_language $web404_lang {
        default en-US;
        ~*^zh zh-cn;
        ~*zh-cn zh-cn;
        ~*zh-hans zh-cn;
    }

    server {
        listen 80;
        server_name _;

        root .;
        index index.html;

        location = / {
            return 302 /$web404_lang/;
        }

        location = /zh-cn {
            return 302 /zh-cn/;
        }

        location = /en-US {
            return 302 /en-US/;
        }

        location /zh-cn/ {
            error_page 404 =404 @zh_cn_404;
            add_header X-Robots-Tag "noindex, nofollow" always;
            return 404;
        }

        location /en-US/ {
            error_page 404 =404 @en_us_404;
            add_header X-Robots-Tag "noindex, nofollow" always;
            return 404;
        }

        location / {
            error_page 404 =404 @web404_lang_404;
            add_header X-Robots-Tag "noindex, nofollow" always;
            return 404;
        }

        location @zh_cn_404 {
            internal;
            try_files /zh-cn/index.html =404;
        }

        location @en_us_404 {
            internal;
            try_files /en-US/index.html =404;
        }

        location @web404_lang_404 {
            internal;
            try_files /$web404_lang/index.html =404;
        }
    }
}
